<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <!-- Subtle Horizontal TV Scan Lines through 'TV' & 'BrightSide' -->
  <g stroke="#FFB347" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M210 24 H330" />
    <path d="M216 31 H332" />
    <path d="M214 38 H330" />
    <path d="M220 45 H326" />
  </g>

  <!-- Soft Radiant Light Accent behind 'TV' -->
  <g stroke="#FFB347" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M250 16 L258 6" />
    <path d="M280 14 L292 4" />
    <path d="M310 18 L326 10" />
    <path d="M250 56 L258 64" />
    <path d="M285 58 L296 66" />
  </g>

  <!-- "Bright" (White) -->
  <text x="6" y="48" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="40" letter-spacing="-0.03em" fill="#FFFFFF">Bright</text>

  <!-- "Side" (White) -->
  <text x="126" y="48" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="40" letter-spacing="-0.03em" fill="#FFFFFF">Side</text>

  <!-- "TV" (Bigger, Close & Bold Orange-Yellow) -->
  <text x="218" y="49" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.01em" fill="#FFB347">TV</text>
</svg>
